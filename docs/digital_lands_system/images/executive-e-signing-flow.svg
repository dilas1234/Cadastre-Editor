<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1180" viewBox="0 0 1900 1180" font-family="Segoe UI,Arial,Helvetica,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b5470"/></marker>
<filter id="sh"><feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-opacity=".18"/></filter></defs><rect width="1900" height="1180" fill="#fff"/><text x="30" y="44" font-size="20" font-weight="700" fill="#0f2b46">Executive e-signing — Commissioner, Permanent Secretary and Governor sign from phone, tablet or desktop</text><text x="30" y="68" font-size="12.5" fill="#3d4f61">The Registry decides when a file needs a signature; the Desk shows it on any device; the key never leaves the HSM; the Bridge moves the Registry on.</text><text x="30" y="86" font-size="12.5" fill="#3d4f61">Example stages: Approve Land Form 5 (Commissioner) · Approve Recommendation (Commissioner / Governor) · Approve Certificate of Occupancy (Governor).</text><rect x="30" y="120" width="255" height="910" rx="10" fill="#fbefe4" stroke="#7a3d0c" stroke-opacity=".5"/><rect x="30" y="120" width="255" height="34" rx="10" fill="#7a3d0c"/><text x="157.5" y="142" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Aumentum Registry (.5)</text><rect x="293" y="120" width="255" height="910" rx="10" fill="#fdf5ea" stroke="#b85c00" stroke-opacity=".5"/><rect x="293" y="120" width="255" height="34" rx="10" fill="#b85c00"/><text x="420.5" y="142" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Registry Bridge (LAN)</text><rect x="556" y="120" width="255" height="910" rx="10" fill="#eef7f1" stroke="#2d7a4c" stroke-opacity=".5"/><rect x="556" y="120" width="255" height="34" rx="10" fill="#2d7a4c"/><text x="683.5" y="142" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Executive Desk (DMZ)</text><rect x="819" y="120" width="255" height="910" rx="10" fill="#f6f0fa" stroke="#7b3fa0" stroke-opacity=".5"/><rect x="819" y="120" width="255" height="34" rx="10" fill="#7b3fa0"/><text x="946.5" y="142" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Permanent Secretary</text><rect x="1082" y="120" width="255" height="910" rx="10" fill="#f6f0fa" stroke="#7b3fa0" stroke-opacity=".5"/><rect x="1082" y="120" width="255" height="34" rx="10" fill="#7b3fa0"/><text x="1209.5" y="142" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Commissioner / Governor</text><rect x="1345" y="120" width="255" height="910" rx="10" fill="#f6f0fa" stroke="#7b3fa0" stroke-opacity=".5"/><rect x="1345" y="120" width="255" height="34" rx="10" fill="#7b3fa0"/><text x="1472.5" y="142" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Signing Service + HSM (LAN)</text><rect x="1608" y="120" width="255" height="910" rx="10" fill="#f3f6fa" stroke="#41607f" stroke-opacity=".5"/><rect x="1608" y="120" width="255" height="34" rx="10" fill="#41607f"/><text x="1735.5" y="142" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Certificates · Applicant</text><g filter="url(#sh)"><rect x="40" y="170" width="235" height="66" rx="8" fill="#fff" stroke="#7a3d0c" stroke-width="1.4"/></g><text x="70" y="190" font-size="12.5" font-weight="700" fill="#1b2a3a">File reaches an approval stage</text><text x="70" y="206" font-size="11.5" font-weight="400" fill="#1b2a3a">e.g. ApproveLandForm5 /</text><text x="70" y="222" font-size="11.5" font-weight="400" fill="#1b2a3a">ApproveCofO (task open)</text><circle cx="55" cy="186" r="10" fill="#7a3d0c"/><text x="55" y="190" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><g filter="url(#sh)"><rect x="303" y="170" width="235" height="82" rx="8" fill="#fff" stroke="#b85c00" stroke-width="2.4"/></g><text x="333" y="190" font-size="12.5" font-weight="700" fill="#1b2a3a">Signing package</text><text x="333" y="206" font-size="11.5" font-weight="400" fill="#1b2a3a">sees the open task in history</text><text x="333" y="222" font-size="11.5" font-weight="400" fill="#1b2a3a">PDF to sign + map + journey</text><text x="333" y="238" font-size="11.5" font-weight="400" fill="#1b2a3a">+ checks (fees, UPIN, SQCO)</text><circle cx="318" cy="186" r="10" fill="#b85c00"/><text x="318" y="190" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><path d="M275,203.0 C289.0,203.0 289.0,211.0 303,211.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><g filter="url(#sh)"><rect x="566" y="170" width="235" height="66" rx="8" fill="#fff" stroke="#2d7a4c" stroke-width="1.4"/></g><text x="596" y="190" font-size="12.5" font-weight="700" fill="#1b2a3a">Dashboard card + push</text><text x="596" y="206" font-size="11.5" font-weight="400" fill="#1b2a3a">“New file at your desk”</text><text x="596" y="222" font-size="11.5" font-weight="400" fill="#1b2a3a">ageing, filters, search</text><circle cx="581" cy="186" r="10" fill="#2d7a4c"/><text x="581" y="190" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><path d="M538,211.0 C552.0,211.0 552.0,203.0 566,203.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><g filter="url(#sh)"><rect x="829" y="320" width="235" height="82" rx="8" fill="#fff" stroke="#7b3fa0" stroke-width="1.4"/></g><text x="859" y="340" font-size="12.5" font-weight="700" fill="#1b2a3a">Endorse or return</text><text x="859" y="356" font-size="11.5" font-weight="400" fill="#1b2a3a">reads on any device</text><text x="859" y="372" font-size="11.5" font-weight="400" fill="#1b2a3a">minute + endorsement ✍</text><text x="859" y="388" font-size="11.5" font-weight="400" fill="#1b2a3a">(passkey) — rule per stage</text><circle cx="844" cy="336" r="10" fill="#7b3fa0"/><text x="844" y="340" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><path d="M801,203.0 C815.0,203.0 815.0,361.0 829,361.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><text x="815.0" y="277.0" font-size="10.5" fill="#3b5470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">if Perm Sec rule on</text><g filter="url(#sh)"><rect x="1092" y="450" width="235" height="130" rx="8" fill="#fff" stroke="#7b3fa0" stroke-width="2.4"/></g><text x="1122" y="470" font-size="12.5" font-weight="700" fill="#1b2a3a">Review &amp; decide</text><text x="1122" y="486" font-size="11.5" font-weight="400" fill="#1b2a3a">phone · tablet · desktop</text><text x="1122" y="502" font-size="11.5" font-weight="400" fill="#1b2a3a">document, map, minutes,</text><text x="1122" y="518" font-size="11.5" font-weight="400" fill="#1b2a3a">Perm Sec endorsement</text><text x="1122" y="534" font-size="11.5" font-weight="400" fill="#1b2a3a">Approve &amp; sign → passkey</text><text x="1122" y="550" font-size="11.5" font-weight="400" fill="#1b2a3a">→ request via DMZ queue</text><text x="1122" y="566" font-size="11.5" font-weight="400" fill="#1b2a3a">or Return with minute</text><circle cx="1107" cy="466" r="10" fill="#7b3fa0"/><text x="1107" y="470" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><path d="M1064,361.0 C1078.0,361.0 1078.0,515.0 1092,515.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><text x="1078.0" y="433.0" font-size="10.5" fill="#3b5470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">endorsed</text><g filter="url(#sh)"><rect x="1355" y="450" width="235" height="98" rx="8" fill="#fff" stroke="#7b3fa0" stroke-width="2.4"/></g><text x="1385" y="470" font-size="12.5" font-weight="700" fill="#1b2a3a">Sign in the HSM</text><text x="1385" y="486" font-size="11.5" font-weight="400" fill="#1b2a3a">verify passkey (fresh),</text><text x="1385" y="502" font-size="11.5" font-weight="400" fill="#1b2a3a">role + live Registry task,</text><text x="1385" y="518" font-size="11.5" font-weight="400" fill="#1b2a3a">hash = what was shown</text><text x="1385" y="534" font-size="11.5" font-weight="400" fill="#1b2a3a">PAdES + seal + timestamp</text><circle cx="1370" cy="466" r="10" fill="#7b3fa0"/><text x="1370" y="470" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text><path d="M1327,515.0 C1341.0,515.0 1341.0,499.0 1355,499.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><g filter="url(#sh)"><rect x="303" y="640" width="235" height="98" rx="8" fill="#fff" stroke="#b85c00" stroke-width="2.4"/></g><text x="333" y="660" font-size="12.5" font-weight="700" fill="#1b2a3a">Move the Registry on</text><text x="333" y="676" font-size="11.5" font-weight="400" fill="#1b2a3a">lock task</text><text x="333" y="692" font-size="11.5" font-weight="400" fill="#1b2a3a">attach signed PDF</text><text x="333" y="708" font-size="11.5" font-weight="400" fill="#1b2a3a">completeTask → next stage</text><text x="333" y="724" font-size="11.5" font-weight="400" fill="#1b2a3a">unlock · audit</text><circle cx="318" cy="656" r="10" fill="#b85c00"/><text x="318" y="660" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">7</text><path d="M1472.5,548 L1472.5,790 L420.5,790 L420.5,738" fill="none" stroke="#3b5470" stroke-width="1.7" marker-end="url(#a)"/><text x="946.5" y="784" font-size="10.5" fill="#3b5470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">signed PDF + signature id (pulled by the Bridge)</text><g filter="url(#sh)"><rect x="40" y="640" width="235" height="82" rx="8" fill="#fff" stroke="#7a3d0c" stroke-width="1.4"/></g><text x="70" y="660" font-size="12.5" font-weight="700" fill="#1b2a3a">Next stage as today</text><text x="70" y="676" font-size="11.5" font-weight="400" fill="#1b2a3a">Review Signed … →</text><text x="70" y="692" font-size="11.5" font-weight="400" fill="#1b2a3a">Register (Deeds Registrar</text><text x="70" y="708" font-size="11.5" font-weight="400" fill="#1b2a3a">✍ + stamp)</text><circle cx="55" cy="656" r="10" fill="#7a3d0c"/><text x="55" y="660" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">8</text><path d="M303,689.0 C289.0,689.0 289.0,681.0 275,681.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><text x="289.0" y="680.0" font-size="10.5" fill="#3b5470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">SOAP</text><g filter="url(#sh)"><rect x="566" y="640" width="235" height="66" rx="8" fill="#fff" stroke="#2d7a4c" stroke-width="1.4"/></g><text x="576" y="660" font-size="12.5" font-weight="700" fill="#1b2a3a">Desk: “Signed and sent”</text><text x="576" y="676" font-size="11.5" font-weight="400" fill="#1b2a3a">file leaves the queue</text><text x="576" y="692" font-size="11.5" font-weight="400" fill="#1b2a3a">push confirmation</text><path d="M538,689.0 C552.0,689.0 552.0,673.0 566,673.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><g filter="url(#sh)"><rect x="1618" y="830" width="235" height="98" rx="8" fill="#fff" stroke="#41607f" stroke-width="1.4"/></g><text x="1648" y="850" font-size="12.5" font-weight="700" fill="#1b2a3a">Digital certificate</text><text x="1648" y="866" font-size="11.5" font-weight="400" fill="#1b2a3a">Certificate Service: final PDF</text><text x="1648" y="882" font-size="11.5" font-weight="400" fill="#1b2a3a">+ Registrar stamp + QR</text><text x="1648" y="898" font-size="11.5" font-weight="400" fill="#1b2a3a">→ applicant wallet</text><text x="1648" y="914" font-size="11.5" font-weight="400" fill="#1b2a3a">scan to verify</text><circle cx="1633" cy="846" r="10" fill="#41607f"/><text x="1633" y="850" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">9</text><path d="M157.5,722 L157.5,1000 L1594,1000 L1594,879.0 L1618,879.0" fill="none" stroke="#3b5470" stroke-width="1.7" marker-end="url(#a)"/><text x="1029.0" y="994" font-size="10.5" fill="#3b5470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">registered → final certificate</text><g filter="url(#sh)"><rect x="829" y="840" width="235" height="82" rx="8" fill="#fff" stroke="#7b3fa0" stroke-width="1.4"/></g><text x="859" y="860" font-size="12.5" font-weight="700" fill="#1b2a3a">Return with minute</text><text x="859" y="876" font-size="11.5" font-weight="400" fill="#1b2a3a">no signature · task stays</text><text x="859" y="892" font-size="11.5" font-weight="400" fill="#1b2a3a">with the executive · officer</text><text x="859" y="908" font-size="11.5" font-weight="400" fill="#1b2a3a">corrects → resubmitted</text><circle cx="844" cy="856" r="10" fill="#7b3fa0"/><text x="844" y="860" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">10</text><g filter="url(#sh)"><rect x="303" y="840" width="235" height="82" rx="8" fill="#fff" stroke="#b85c00" stroke-width="1.4"/></g><text x="313" y="860" font-size="12.5" font-weight="700" fill="#1b2a3a">Back Office queue</text><text x="313" y="876" font-size="11.5" font-weight="400" fill="#1b2a3a">preparing officer gets</text><text x="313" y="892" font-size="11.5" font-weight="400" fill="#1b2a3a">the minute, regenerates</text><text x="313" y="908" font-size="11.5" font-weight="400" fill="#1b2a3a">the document, resubmits</text><path d="M829,881.0 C683.5,881.0 683.5,881.0 538,881.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><text x="683.5" y="876.0" font-size="10.5" fill="#3b5470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">minute</text><rect x="30" y="1040" width="1840" height="118" rx="10" fill="#f7f9fb" stroke="#d3dbe4"/><text x="50" y="1066" font-size="14" font-weight="700" fill="#0f2b46">Safeguards</text><circle cx="54" cy="1086" r="3.5" fill="#2d7a4c"/><text x="64" y="1090" font-size="12" fill="#1b2a3a">Key never leaves the HSM — the phone only proves who the signer is (passkey on a registered device)</text><circle cx="874" cy="1086" r="3.5" fill="#2d7a4c"/><text x="884" y="1090" font-size="12" fill="#1b2a3a">What You See Is What You Sign — the hash of the exact PDF shown is signed; changed documents are refused</text><circle cx="54" cy="1108" r="3.5" fill="#2d7a4c"/><text x="64" y="1112" font-size="12" fill="#1b2a3a">Signer must hold the role and the Registry task must be open at that stage — checked at signing time</text><circle cx="874" cy="1108" r="3.5" fill="#2d7a4c"/><text x="884" y="1112" font-size="12" fill="#1b2a3a">No inbound connection to the LAN — the Desk and the Signing Service talk through DMZ queues pulled from the LAN</text><circle cx="54" cy="1130" r="3.5" fill="#2d7a4c"/><text x="64" y="1134" font-size="12" fill="#1b2a3a">Governor batch signing — one confirmation, one separate signature + timestamp + QR per certificate</text><circle cx="874" cy="1130" r="3.5" fill="#2d7a4c"/><text x="884" y="1134" font-size="12" fill="#1b2a3a">Every view, minute, endorsement and signature is in a hash-chained audit log (device, IP, time)</text></svg>