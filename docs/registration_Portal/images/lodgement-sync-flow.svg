<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1240" viewBox="0 0 1700 1240" font-family="Segoe UI,Arial,Helvetica,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b5470"/></marker>
<filter id="sh"><feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-opacity=".18"/></filter></defs><rect width="1700" height="1240" fill="#fff"/><text x="30" y="44" font-size="20" font-weight="700" fill="#0f2b46">Automatic lodgement and sync — portal application → Aumentum Registry</text><text x="30" y="68" font-size="12.5" fill="#3d4f61">The Bridge replays exactly what the Registry Desktop does (same services, whole-batch save, client rules, task locks). Every step is checkpointed and idempotent.</text><text x="30" y="86" font-size="12.5" fill="#3d4f61">Owner of the data: Portal until payment is confirmed → Bridge while lodging → Registry afterwards (portal mirrors it).</text><rect x="30" y="120" width="267" height="970" rx="10" fill="#f3f6fa" stroke="#41607f" stroke-opacity=".5"/><rect x="30" y="120" width="267" height="34" rx="10" fill="#41607f"/><text x="163.5" y="142" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Applicant</text><rect x="305" y="120" width="267" height="970" rx="10" fill="#eef7f1" stroke="#2d7a4c" stroke-opacity=".5"/><rect x="305" y="120" width="267" height="34" rx="10" fill="#2d7a4c"/><text x="438.5" y="142" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Portal (DMZ)</text><rect x="580" y="120" width="267" height="970" rx="10" fill="#f6f0fa" stroke="#8a4fb0" stroke-opacity=".5"/><rect x="580" y="120" width="267" height="34" rx="10" fill="#8a4fb0"/><text x="713.5" y="142" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Accounts (back office)</text><rect x="855" y="120" width="267" height="970" rx="10" fill="#fdf5ea" stroke="#b85c00" stroke-opacity=".5"/><rect x="855" y="120" width="267" height="34" rx="10" fill="#b85c00"/><text x="988.5" y="142" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Registry Bridge (LAN)</text><rect x="1130" y="120" width="267" height="970" rx="10" fill="#fbefe4" stroke="#7a3d0c" stroke-opacity=".5"/><rect x="1130" y="120" width="267" height="34" rx="10" fill="#7a3d0c"/><text x="1263.5" y="142" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Aumentum Registry (.5)</text><rect x="1405" y="120" width="267" height="970" rx="10" fill="#f3f6fa" stroke="#41607f" stroke-opacity=".5"/><rect x="1405" y="120" width="267" height="34" rx="10" fill="#41607f"/><text x="1538.5" y="142" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Officers (Registry Desktop)</text><g filter="url(#sh)"><rect x="40" y="170" width="247" height="66" rx="8" fill="#fff" stroke="#41607f" stroke-width="1.4"/></g><text x="70" y="190" font-size="12.5" font-weight="700" fill="#1b2a3a">Fill form + upload documents</text><text x="70" y="206" font-size="11.5" font-weight="400" fill="#1b2a3a">Wizard or fillable PDF</text><text x="70" y="222" font-size="11.5" font-weight="400" fill="#1b2a3a">Drop-downs = Registry codes</text><circle cx="55" cy="186" r="10" fill="#41607f"/><text x="55" y="190" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><g filter="url(#sh)"><rect x="315" y="170" width="247" height="82" rx="8" fill="#fff" stroke="#2d7a4c" stroke-width="1.4"/></g><text x="345" y="190" font-size="12.5" font-weight="700" fill="#1b2a3a">Validate</text><text x="345" y="206" font-size="11.5" font-weight="400" fill="#1b2a3a">Form built nightly from Registry:</text><text x="345" y="222" font-size="11.5" font-weight="400" fill="#1b2a3a">lr_formfield, dictionaries,</text><text x="345" y="238" font-size="11.5" font-weight="400" fill="#1b2a3a">metadata (mandatory docs, fees)</text><circle cx="330" cy="186" r="10" fill="#2d7a4c"/><text x="330" y="190" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><g filter="url(#sh)"><rect x="865" y="170" width="247" height="82" rx="8" fill="#fff" stroke="#b85c00" stroke-width="1.4"/></g><text x="895" y="190" font-size="12.5" font-weight="700" fill="#1b2a3a">Pre-checks + fee quote</text><text x="895" y="206" font-size="11.5" font-weight="400" fill="#1b2a3a">Property, title owner, blocking</text><text x="895" y="222" font-size="11.5" font-weight="400" fill="#1b2a3a">transactions, ground rent</text><text x="895" y="238" font-size="11.5" font-weight="400" fill="#1b2a3a">Fees = Registry calculation</text><circle cx="880" cy="186" r="10" fill="#b85c00"/><text x="880" y="190" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><g filter="url(#sh)"><rect x="1140" y="170" width="247" height="50" rx="8" fill="#fff" stroke="#7a3d0c" stroke-width="1.4"/></g><text x="1150" y="190" font-size="12.5" font-weight="700" fill="#1b2a3a">Read (DomainModelService,</text><text x="1150" y="206" font-size="11.5" font-weight="400" fill="#1b2a3a">CashierService.CalculateFee)</text><path d="M287,203.0 C301.0,203.0 301.0,211.0 315,211.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><path d="M562,211.0 C713.5,211.0 713.5,211.0 865,211.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><text x="713.5" y="206.0" font-size="10.5" fill="#3b5470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">check + quote</text><path d="M1112,211.0 C1126.0,211.0 1126.0,195.0 1140,195.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><g filter="url(#sh)"><rect x="315" y="300" width="247" height="66" rx="8" fill="#fff" stroke="#2d7a4c" stroke-width="1.4"/></g><text x="345" y="320" font-size="12.5" font-weight="700" fill="#1b2a3a">Invoice / demand notice</text><text x="345" y="336" font-size="11.5" font-weight="400" fill="#1b2a3a">INV no. from Registry counter</text><text x="345" y="352" font-size="11.5" font-weight="400" fill="#1b2a3a">Gateway reference (RRR)</text><circle cx="330" cy="316" r="10" fill="#2d7a4c"/><text x="330" y="320" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><g filter="url(#sh)"><rect x="40" y="300" width="247" height="66" rx="8" fill="#fff" stroke="#41607f" stroke-width="1.4"/></g><text x="70" y="320" font-size="12.5" font-weight="700" fill="#1b2a3a">Pay via gateway</text><text x="70" y="336" font-size="11.5" font-weight="400" fill="#1b2a3a">invoice received by SMS / e-mail</text><text x="70" y="352" font-size="11.5" font-weight="400" fill="#1b2a3a">card · transfer · USSD · bank</text><circle cx="55" cy="316" r="10" fill="#41607f"/><text x="55" y="320" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><path d="M315,333.0 C301.0,333.0 301.0,333.0 287,333.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><g filter="url(#sh)"><rect x="315" y="400" width="247" height="66" rx="8" fill="#fff" stroke="#2d7a4c" stroke-width="1.4"/></g><text x="345" y="420" font-size="12.5" font-weight="700" fill="#1b2a3a">Webhook + verify</text><text x="345" y="436" font-size="11.5" font-weight="400" fill="#1b2a3a">server-to-server, amount,</text><text x="345" y="452" font-size="11.5" font-weight="400" fill="#1b2a3a">reference, merchant</text><circle cx="330" cy="416" r="10" fill="#2d7a4c"/><text x="330" y="420" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text><path d="M287,333.0 C301.0,333.0 301.0,433.0 315,433.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><g filter="url(#sh)"><rect x="590" y="400" width="247" height="82" rx="8" fill="#fff" stroke="#8a4fb0" stroke-width="2.4"/></g><text x="620" y="420" font-size="12.5" font-weight="700" fill="#1b2a3a">Confirm payment</text><text x="620" y="436" font-size="11.5" font-weight="400" fill="#1b2a3a">queue: paid + verified</text><text x="620" y="452" font-size="11.5" font-weight="400" fill="#1b2a3a">one-by-one or bulk after</text><text x="620" y="468" font-size="11.5" font-weight="400" fill="#1b2a3a">settlement / statement match</text><circle cx="605" cy="416" r="10" fill="#8a4fb0"/><text x="605" y="420" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">7</text><path d="M562,433.0 C576.0,433.0 576.0,441.0 590,441.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><g filter="url(#sh)"><rect x="315" y="500" width="247" height="66" rx="8" fill="#fff" stroke="#2d7a4c" stroke-width="1.4"/></g><text x="345" y="520" font-size="12.5" font-weight="700" fill="#1b2a3a">E-receipt to applicant</text><text x="345" y="536" font-size="11.5" font-weight="400" fill="#1b2a3a">RCT no. (Registry counter)</text><text x="345" y="552" font-size="11.5" font-weight="400" fill="#1b2a3a">SMS + e-mail + download</text><circle cx="330" cy="516" r="10" fill="#2d7a4c"/><text x="330" y="520" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">8</text><path d="M590,441.0 C576.0,441.0 576.0,533.0 562,533.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><g filter="url(#sh)"><rect x="40" y="500" width="247" height="34" rx="8" fill="#fff" stroke="#41607f" stroke-width="1.4"/></g><text x="50" y="520" font-size="12.5" font-weight="700" fill="#1b2a3a">Receives receipt</text><path d="M315,533.0 C301.0,533.0 301.0,517.0 287,517.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><g filter="url(#sh)"><rect x="865" y="600" width="247" height="210" rx="8" fill="#fff" stroke="#b85c00" stroke-width="2.4"/></g><text x="895" y="620" font-size="12.5" font-weight="700" fill="#1b2a3a">Lodgement step machine</text><text x="895" y="636" font-size="11.5" font-weight="400" fill="#1b2a3a">a  re-check property (may have changed)</text><text x="895" y="652" font-size="11.5" font-weight="400" fill="#1b2a3a">b  startProcessInstance → Lodge task</text><text x="895" y="668" font-size="11.5" font-weight="400" fill="#1b2a3a">c  AcceptApplication(whole batch)</text><text x="895" y="684" font-size="11.5" font-weight="400" fill="#1b2a3a">     → batch, transaction, PLS no.</text><text x="895" y="700" font-size="11.5" font-weight="400" fill="#1b2a3a">d  upload docs → IncomingDocuments</text><text x="895" y="716" font-size="11.5" font-weight="400" fill="#1b2a3a">e  lodgement letter (same INV no.)</text><text x="895" y="732" font-size="11.5" font-weight="400" fill="#1b2a3a">f  run Lodge rules, lock task,</text><text x="895" y="748" font-size="11.5" font-weight="400" fill="#1b2a3a">     completeTask → Scan Incoming</text><text x="895" y="764" font-size="11.5" font-weight="400" fill="#1b2a3a">g  run Scan rules, completeTask</text><text x="895" y="780" font-size="11.5" font-weight="400" fill="#1b2a3a">each step: read first, act once,</text><text x="895" y="796" font-size="11.5" font-weight="400" fill="#1b2a3a">checkpoint in plagis_ext</text><circle cx="880" cy="616" r="10" fill="#b85c00"/><text x="880" y="620" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">9</text><path d="M562,533.0 C713.5,533.0 713.5,705.0 865,705.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><text x="713.5" y="614.0" font-size="10.5" fill="#3b5470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">outbox: lodge (Bridge pulls)</text><g filter="url(#sh)"><rect x="1140" y="610" width="247" height="114" rx="8" fill="#fff" stroke="#7a3d0c" stroke-width="1.4"/></g><text x="1150" y="630" font-size="12.5" font-weight="700" fill="#1b2a3a">Same calls as the Desktop</text><text x="1150" y="646" font-size="11.5" font-weight="400" fill="#1b2a3a">Server issues numbers, writes</text><text x="1150" y="662" font-size="11.5" font-weight="400" fill="#1b2a3a">lr_process_history, puts file</text><text x="1150" y="678" font-size="11.5" font-weight="400" fill="#1b2a3a">in the next queue</text><text x="1150" y="694" font-size="11.5" font-weight="400" fill="#1b2a3a">Comment: “Lodged from portal</text><text x="1150" y="710" font-size="11.5" font-weight="400" fill="#1b2a3a">PRT-… (confirmed by …)”</text><path d="M1112,705.0 C1126.0,705.0 1126.0,667.0 1140,667.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><text x="1126.0" y="681.0" font-size="10.5" fill="#3b5470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">SOAP</text><g filter="url(#sh)"><rect x="40" y="720" width="247" height="66" rx="8" fill="#fff" stroke="#41607f" stroke-width="1.4"/></g><text x="50" y="740" font-size="12.5" font-weight="700" fill="#1b2a3a">Gets PLS no. +</text><text x="50" y="756" font-size="11.5" font-weight="400" fill="#1b2a3a">acknowledgement letter</text><text x="50" y="772" font-size="11.5" font-weight="400" fill="#1b2a3a">(SMS + e-mail + download)</text><path d="M865,705.0 C576.0,705.0 576.0,753.0 287,753.0" fill="none" stroke="#3b5470" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="576.0" y="724.0" font-size="10.5" fill="#3b5470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">PLS no. + acknowledgement, via the portal</text><g filter="url(#sh)"><rect x="1415" y="860" width="247" height="82" rx="8" fill="#fff" stroke="#41607f" stroke-width="1.4"/></g><text x="1445" y="880" font-size="12.5" font-weight="700" fill="#1b2a3a">Open New Property File</text><text x="1445" y="896" font-size="11.5" font-weight="400" fill="#1b2a3a">Lands Officer → PL no.</text><text x="1445" y="912" font-size="11.5" font-weight="400" fill="#1b2a3a">(First Registration only;</text><text x="1445" y="928" font-size="11.5" font-weight="400" fill="#1b2a3a">other types skip this)</text><circle cx="1430" cy="876" r="10" fill="#41607f"/><text x="1430" y="880" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">10</text><g filter="url(#sh)"><rect x="865" y="860" width="247" height="98" rx="8" fill="#fff" stroke="#b85c00" stroke-width="2.4"/></g><text x="895" y="880" font-size="12.5" font-weight="700" fill="#1b2a3a">Post payment</text><text x="895" y="896" font-size="11.5" font-weight="400" fill="#1b2a3a">lr_payment with RCT + gateway ref</text><text x="895" y="912" font-size="11.5" font-weight="400" fill="#1b2a3a">run Cashier rules</text><text x="895" y="928" font-size="11.5" font-weight="400" fill="#1b2a3a">complete Awaiting Fee Payment</text><text x="895" y="944" font-size="11.5" font-weight="400" fill="#1b2a3a">→ Register … Payment</text><circle cx="880" cy="876" r="10" fill="#b85c00"/><text x="880" y="880" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">11</text><path d="M1415,901.0 C1263.5,901.0 1263.5,909.0 1112,909.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><text x="1263.5" y="900.0" font-size="10.5" fill="#3b5470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">task “Awaiting Fee Payment” appears</text><g filter="url(#sh)"><rect x="1415" y="990" width="247" height="98" rx="8" fill="#fff" stroke="#41607f" stroke-width="1.4"/></g><text x="1445" y="1010" font-size="12.5" font-weight="700" fill="#1b2a3a">All later stages as today</text><text x="1445" y="1026" font-size="11.5" font-weight="400" fill="#1b2a3a">Survey checking · Site analysis ·</text><text x="1445" y="1042" font-size="11.5" font-weight="400" fill="#1b2a3a">Land Form 5 (Commissioner) ·</text><text x="1445" y="1058" font-size="11.5" font-weight="400" fill="#1b2a3a">Title deed plan + UPIN · C of O</text><text x="1445" y="1074" font-size="11.5" font-weight="400" fill="#1b2a3a">(Governor) · Register · Delivery</text><circle cx="1430" cy="1006" r="10" fill="#41607f"/><text x="1430" y="1010" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">12</text><g filter="url(#sh)"><rect x="865" y="990" width="247" height="82" rx="8" fill="#fff" stroke="#b85c00" stroke-width="1.4"/></g><text x="895" y="1010" font-size="12.5" font-weight="700" fill="#1b2a3a">Mirror every 60 s</text><text x="895" y="1026" font-size="11.5" font-weight="400" fill="#1b2a3a">lr_process_history, status,</text><text x="895" y="1042" font-size="11.5" font-weight="400" fill="#1b2a3a">PL no., new fees, outgoing docs</text><text x="895" y="1058" font-size="11.5" font-weight="400" fill="#1b2a3a">→ portal · nightly full check</text><circle cx="880" cy="1006" r="10" fill="#b85c00"/><text x="880" y="1010" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">13</text><path d="M1415,1039.0 C1263.5,1039.0 1263.5,1031.0 1112,1031.0" fill="none" stroke="#3b5470" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="1263.5" y="1030.0" font-size="10.5" fill="#3b5470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">history</text><g filter="url(#sh)"><rect x="315" y="990" width="247" height="66" rx="8" fill="#fff" stroke="#2d7a4c" stroke-width="1.4"/></g><text x="325" y="1010" font-size="12.5" font-weight="700" fill="#1b2a3a">Status tracker + SMS</text><text x="325" y="1026" font-size="11.5" font-weight="400" fill="#1b2a3a">“Action required”: accept terms,</text><text x="325" y="1042" font-size="11.5" font-weight="400" fill="#1b2a3a">pay C of O fees, upload missing doc</text><path d="M865,1031.0 C713.5,1031.0 713.5,1023.0 562,1023.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><g filter="url(#sh)"><rect x="40" y="990" width="247" height="66" rx="8" fill="#fff" stroke="#41607f" stroke-width="1.4"/></g><text x="70" y="1010" font-size="12.5" font-weight="700" fill="#1b2a3a">Accepts terms (OTP)</text><text x="70" y="1026" font-size="11.5" font-weight="400" fill="#1b2a3a">Pays C of O fees</text><text x="70" y="1042" font-size="11.5" font-weight="400" fill="#1b2a3a">→ Bridge completes the task</text><circle cx="55" cy="1006" r="10" fill="#41607f"/><text x="55" y="1010" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">14</text><path d="M315,1023.0 C301.0,1023.0 301.0,1023.0 287,1023.0" fill="none" stroke="#3b5470" stroke-width="1.7"  marker-end="url(#a)"/><rect x="30" y="1100" width="1640" height="118" rx="10" fill="#f7f9fb" stroke="#d3dbe4"/><text x="50" y="1126" font-size="14" font-weight="700" fill="#0f2b46">Why it stays in sync</text><circle cx="54" cy="1146" r="3.5" fill="#2d7a4c"/><text x="64" y="1150" font-size="12" fill="#1b2a3a">One owner at a time — Portal → Bridge → Registry; the portal never edits Registry data after lodgement</text><circle cx="874" cy="1146" r="3.5" fill="#2d7a4c"/><text x="884" y="1150" font-size="12" fill="#1b2a3a">Form built from the Registry&#x27;s own config — fields, required flags, dictionaries, mandatory documents, fees</text><circle cx="54" cy="1168" r="3.5" fill="#2d7a4c"/><text x="64" y="1172" font-size="12" fill="#1b2a3a">Bridge replays the Desktop — same services, batch graph, client rules, task locks, transition names read at run time</text><circle cx="874" cy="1168" r="3.5" fill="#2d7a4c"/><text x="884" y="1172" font-size="12" fill="#1b2a3a">Idempotent, checkpointed steps — retries continue, never duplicate; unique gateway reference per payment</text><circle cx="54" cy="1190" r="3.5" fill="#2d7a4c"/><text x="64" y="1194" font-size="12" fill="#1b2a3a">All numbers from Registry counters — INV, RCT, PLS, PL, PLT; portal only has its PRT reference</text><circle cx="874" cy="1190" r="3.5" fill="#2d7a4c"/><text x="884" y="1194" font-size="12" fill="#1b2a3a">Mirror every minute + nightly reconciliation — anything unexpected goes to the exception queue (Retry / Done by hand / Cancel)</text></svg>