[package]
name = "cadastre-import"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Read-only import of the Aumentum ArcSDE geodatabase into the Cadastre schema."

[lints]
workspace = true

[features]
# Default build is the pure, DB-free logic (reconstruction SQL, mapping, WKT, exceptions):
# always compiled and unit-tested, no network. The `live` feature adds the tiberius SQL
# Server client used to read a (restored, non-production) `sde` database.
default = []
live = ["dep:tiberius", "dep:tokio", "dep:tokio-util", "dep:futures-util"]

[dependencies]
cadastre-core = { path = "../cadastre-core" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Live SQL Server client (optional; MSSQL/ArcSDE read). tiberius is pure-Rust (no bundled C);
# rustls is acceptable here because the importer runs on a modern host, not the win7 target.
tiberius = { version = "0.12", optional = true, default-features = false, features = ["rustls", "tds73", "chrono"] }
tokio = { version = "1", optional = true, features = ["net", "rt-multi-thread", "macros", "io-util"] }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }
futures-util = { version = "0.3", optional = true }

[[bin]]
name = "cadastre-import"
required-features = ["live"]
