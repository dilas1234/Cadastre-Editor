[package]
name = "cadastre-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "PLAGIS Cadastre Editor REST API server (axum + PostGIS + Keycloak)."

[lints]
workspace = true

[dependencies]
cadastre-core = { path = "../cadastre-core" }

# Async runtime + web framework
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Persistence. runtime-tokio with NO TLS backend: dev connects to Postgres over
# localhost without TLS, and keeping the rustls/ring C-ish crypto stack out of the
# dependency tree protects the win7 server target (NFR-02). TLS is added in Phase 9.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate",
] }

# Serialization + domain glue
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Keycloak JWT stub (decode claims; signature verification is Phase 3). base64 keeps
# this pure-Rust with no crypto C deps.
base64 = "0.22"

# Observability + errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
