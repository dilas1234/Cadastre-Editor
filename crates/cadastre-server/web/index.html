<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PLAGIS CADASTRE Editor</title>
<!-- Vendored (no CDN): the editor must work on the PLAGIS LAN without internet access. -->
<link href="/editor/vendor/maplibre-gl.css" rel="stylesheet"/>
<script src="/editor/vendor/maplibre-gl.js"></script>
<script src="/editor/vendor/proj4.js"></script>
<link href="/editor/style.css" rel="stylesheet"/>
</head>
<body>
<div id="window">
  <!-- Menu bar (built by app.js) -->
  <div id="menubar"></div>

  <!-- Toolbars (built by app.js) -->
  <div id="toolbars">
    <div class="tbrow" id="tbrow1"></div>
    <div class="tbrow" id="tbrow2"></div>
  </div>

  <!-- Docked panes + map -->
  <div id="workspace">
    <aside id="tocPane" class="pane">
      <div class="paneHead"><span>Table Of Contents</span><span class="paneBtns"><span data-pane-pin title="Auto Hide"></span><span data-pane-close="tocPane" title="Close"></span></span></div>
      <div class="paneTools" id="tocTools"></div>
      <div class="paneBody" id="tocBody"></div>
      <div class="paneBody hidden" id="tasksBody"></div>
      <div class="paneBody hidden" id="wfBody"></div>
      <div class="paneBody hidden" id="regBody"></div>
      <div class="paneBody hidden" id="doneBody"></div>
      <div class="hscroll"><span class="arr">&#x25C2;</span><span class="track"><span class="thumb"></span></span><span class="arr">&#x25B8;</span></div>
    </aside>

    <div class="paneResize" data-resize="tocPane" title="Drag to resize"></div>
    <div id="mapFrame">
      <div id="map"></div>
      <div id="mapStrip">
        <span id="stripButtons"></span>
        <span class="arr">&#x25C2;</span><span class="track"><span class="thumb"></span></span><span class="arr">&#x25B8;</span>
      </div>
    </div>

    <div class="paneResize" data-resize="catalogPane" title="Drag to resize"></div>
    <aside id="catalogPane" class="pane">
      <div class="paneHead"><span>Catalog</span><span class="paneBtns"><span data-pane-pin title="Auto Hide"></span><span data-pane-close="catalogPane" title="Close"></span></span></div>
      <div class="paneTools" id="catTools"></div>
      <div class="catLocation"><label>Location:</label><select id="catLocation"></select></div>
      <div class="paneBody" id="catTree"></div>
      <div class="splitter"></div>
      <div class="paneBody" id="catContents"></div>
    </aside>
  </div>

  <!-- Status bar -->
  <div id="statusbar">
    <span id="statusMsg"></span>
    <span class="grow"></span>
    <span id="coordXY">&nbsp;</span>
  </div>
</div>

<!-- Floating windows (Identify, Find, Measure, Go To XY, About…) are created by app.js. -->
<div id="floats"></div>

<script src="/editor/icons.js"></script>
<script src="/editor/app.js"></script>
</body>
</html>
